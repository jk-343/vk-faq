    <script>
        // БЕЗОПАСНАЯ ИНИЦИАЛИЗАЦИЯ VK BRIDGE (Вместо старой одиночной строки)
        window.addEventListener('DOMContentLoaded', () => {
            vkBridge.send("VKWebAppInit")
                .then((data) => {
                    console.log("VK Bridge успешно инициализирован", data);
                })
                .catch((error) => {
                    console.error("Ошибка инициализации:", error);
                });
        });

        // БАЗА ДАННЫХ ВАШЕЙ ЧАТ-КАРТЫ
        const FAQ_DATA = {
            "start": {
                title: "Приветствуем!",
                text: "Это главное меню вашего справочника. Выберите интересующую категорию ниже для навигации по карте проекта.",
                image: "",
                buttons: [
                    { text: "📁 Раздел 1 (Левая ветка)", target: "section_1" },
                    { text: "📁 Раздел 2 (Центральная ветка)", target: "section_2" },
                    { text: "📁 Раздел 3 (Правая ветка)", target: "section_3" },
                    { text: "ℹ️ О проекте", target: "about" }
                ]
            },
            "section_1": {
                title: "Раздел 1",
                text: "Вы перешли в левую ветку меню. Здесь находятся вложенные подпункты и конечные ответы.",
                image: "",
                buttons: [
                    { text: "📄 Подраздел 1.1", target: "subsection_1_1" }
                ]
            },
            "subsection_1_1": {
                title: "Подраздел 1.1",
                text: "Это конечный текстовый блок с ответом на вопрос из левой ветки.",
                image: "",
                buttons: []
            },
            "section_2": {
                title: "Раздел 2",
                text: "Текст описания для центральной категории вашей чат-карты.",
                image: "",
                buttons: []
            },
            "section_3": {
                title: "Раздел 3",
                text: "Информация по третьей ветке вашей схемы.",
                image: "",
                buttons: []
            },
            "about": {
                title: "О проекте",
                text: "Данное мини-приложение разработано для быстрой и удобной навигации по базе знаний.",
                image: "",
                buttons: []
            }
        };

        // Логика навигации (История переходов)
        let navigationHistory = [];
        let currentScreenId = "start";

        function renderScreen(screenId) {
            const screen = FAQ_DATA[screenId];
            if (!screen) return;

            currentScreenId = screenId;

            document.getElementById('screen-title').innerText = screen.title;
            document.getElementById('screen-text').innerText = screen.text;
            document.getElementById('app-header-title').innerText = screenId === 'start' ? 'Главная' : screen.title;

            const imgElement = document.getElementById('screen-image');
            if (screen.image && screen.image.trim() !== "") {
                imgElement.src = screen.image;
                imgElement.style.display = "block";
            } else {
                imgElement.style.display = "none";
            }

            const backBtn = document.getElementById('back-button');
            if (navigationHistory.length > 0) {
                backBtn.style.display = "block";
            } else {
                backBtn.style.display = "none";
            }

            const menuContainer = document.getElementById('buttons-menu');
            menuContainer.innerHTML = "";

            screen.buttons.forEach(buttonData => {
                const btn = document.createElement('div');
                btn.className = "menu-button";
                btn.innerText = buttonData.text;
                btn.onclick = () => navigateTo(buttonData.target);
                menuContainer.appendChild(btn);
            });
        }

        function navigateTo(targetScreenId) {
            if (FAQ_DATA[targetScreenId]) {
                navigationHistory.push(currentScreenId);
                renderScreen(targetScreenId);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function navigateBack() {
            if (navigationHistory.length > 0) {
                const previousScreenId = navigationHistory.pop();
                renderScreen(previousScreenId);
            }
        }

        // Запуск первой отрисовки экрана при старте приложения
        renderScreen("start");
    </script>
